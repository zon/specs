- path: cmd/zpecs
  description: Parses the command line and runs each command's work.

- path: internal/source
  description: Reads and selects skill, agent, and doc definitions from a local source directory.

- path: internal/clone
  description: Clones a repository into a temp dir so a remote source reads like a local one.

- path: internal/target
  description: Names the targets definitions write to.

- path: internal/targetdir
  description: Writes definitions into a repository's target directories under an ownership manifest.

- path: internal/frontmatter
  description: Parses the frontmatter block and body of definition files.

- path: internal/render
  description: Produces each definition's text for its target, verbatim for skills and docs.

- path: internal/report
  description: Formats and prints the lines that report each update run.

- path: internal/repo
  description: Locates the repository root that contains the working directory.

- path: internal/spec
  description: Parses a spec markdown file into a JSON document.

- path: internal/testutil
  description: Builds temp git repositories for tests.

- path: internal/update
  description: Orchestrates update runs: resolving the source, rendering definitions into their targets, and reporting each run.
  orchestration: true
