- path: cmd/zpecs
  description: Runs the CLI commands.

- path: internal/source
  description: Reads definition files from a local source directory.

- path: internal/gitops
  description: Resolves the repository root and clones remote sources.

- path: internal/opencode
  description: Runs opencode to review a repository.

- path: internal/targetdir
  description: Writes definitions into a repository's target directories.

- path: internal/render
  description: Produces each definition's text for its target.

- path: internal/report
  description: Prints the report lines for a run.

- path: internal/spec
  description: Parses a spec into a JSON document.

- path: internal/testutil
  description: Provides shared fixtures and helpers for tests.

- path: internal/update
  description: Orchestrates update runs.
  orchestration: true

- path: internal/review
  description: Orchestrates review runs.
  orchestration: true
