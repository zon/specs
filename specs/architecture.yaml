- path: cmd/zpecs
  description: Parses the command line and runs each command's work.

- path: internal/source
  description: Reads and selects skill, agent, and doc definitions from a local source directory and owns the per-kind file layout.

- path: internal/gitops
  description: Locates the repository root and clones a remote source into a temp dir so the copy reads like a local one.

- path: internal/opencode
  description: Runs the opencode CLI to review a repository against the guidelines for a scope.

- path: internal/targetdir
  description: Writes definitions into a repository's target directories under an ownership manifest.

- path: internal/render
  description: Parses definition files and produces each one's text for its target, verbatim for skills and docs.

- path: internal/report
  description: Formats and prints the lines that report each update run.

- path: internal/spec
  description: Parses a spec markdown file into a JSON document.

- path: internal/testutil
  description: Provides shared fixtures and helpers for tests.

- path: internal/update
  description: Orchestrates update runs: resolving the source, rendering definitions into their targets, and reporting each one.
  orchestration: true

- path: internal/review
  description: Orchestrates review runs: locating the repository root and delegating them to opencode.
  orchestration: true
