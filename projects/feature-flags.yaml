- "The `zpecs update` command accepts a `--orchestration` flag, off by default, and the enabled feature names reach the code that renders skills, agents, and docs."
- "Rendering runs each skill, agent, and doc through Go's `text/template` with the enabled feature names as data, so a definition can wrap optional content in `{{if .orchestration}}` blocks. A disabled block leaves no blank line or dangling list punctuation behind."
- "The system does not write a definition that renders to nothing, drops it from the ownership manifest, and removes it from the target if a previous run wrote it. The run's summary counts only the definitions it wrote."
- "The orchestration-only documents carry optional markers: `docs/zpecs/orchestration.md` in full, the orchestration list item in `docs/zpecs/README.md`, the orchestration parts and links in `docs/zpecs/architecture.md`, the `orchestration` field and examples in `docs/zpecs/architecture-outline.md`, and the orchestration module entry in `docs/zpecs/glossary.md`. With the feature off, no written doc mentions orchestration or links to the orchestration document."
- "Orchestration guidance in the skills and agents carries optional markers: step 4 of `skills/write-architecture/SKILL.md`, steps 5 and 8 of `agents/code-architect.md`, and steps 2 and 3 of `agents/component-reviewer.md`. With the feature off, the written definitions hold no orchestration instruction or link."
- "`docs/cli/README.md` and `README.md` document the `--orchestration` flag and state that it is off by default."
- "Tests cover the flag for each kind: docs, skills, and agents include optional content when the flag is on and omit it when off, a link to gated content disappears and returns with the flag, and turning the flag off removes a previously written optional document."
- "Running `zpecs update` on this repository without the flag writes no orchestration document and no link to it, and running with the flag restores both."
- "Apply a semver minor bump to the CLI version."
